<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Golf Swing Video Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #38bdf8;
      margin-bottom: 8px;
    }

    p {
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      /* 16:9 Aspect Ratio */
      padding-bottom: 56.25%; 
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      background-color: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <h1>Golf Swing Drill Player</h1>
  <p>Configured with strict-origin referrer policies to bypass configuration errors.</p>

  <div class="video-container">
    <iframe 
      src="https://www.youtube-nocookie.com/embed/rpdWDKql86U"
      title="YouTube video player" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
